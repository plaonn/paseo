name: Android Dev APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to build"
        required: true
        default: "plaonn/local"
        type: string
      publish_latest:
        description: "Also update the public dev-latest prerelease asset"
        required: true
        default: false
        type: boolean

concurrency:
  group: android-dev-apk-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Resolve source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build development APK on EAS
        id: eas_build
        shell: bash
        run: |
          set -euo pipefail
          cd packages/app

          build_json="$(npx eas build --platform android --profile development --non-interactive --wait --json)"
          echo "$build_json" > "$RUNNER_TEMP/eas-build.json"

          build_id="$(jq -r 'if type == "array" then .[0].id // empty else .id // empty end' "$RUNNER_TEMP/eas-build.json")"
          if [ -z "$build_id" ]; then
            echo "Failed to determine EAS build ID."
            cat "$RUNNER_TEMP/eas-build.json"
            exit 1
          fi

          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Download APK and create checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd packages/app

          build_view_json="$(npx eas build:view '${{ steps.eas_build.outputs.build_id }}' --json)"
          echo "$build_view_json" > "$RUNNER_TEMP/eas-build-view.json"

          artifact_url="$(jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' "$RUNNER_TEMP/eas-build-view.json")"
          if [ -z "$artifact_url" ]; then
            echo "Failed to determine APK artifact URL."
            cat "$RUNNER_TEMP/eas-build-view.json"
            exit 1
          fi

          asset_name="paseo-debug-${{ steps.source.outputs.short_sha }}.apk"
          asset_path="$RUNNER_TEMP/$asset_name"
          checksum_path="$RUNNER_TEMP/SHA256SUMS.txt"

          curl --fail --location --output "$asset_path" "$artifact_url"
          sha256sum "$asset_path" | sed "s#  $asset_path#  $asset_name#" > "$checksum_path"

          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: paseo-debug-${{ steps.source.outputs.short_sha }}
          path: |
            ${{ steps.artifact.outputs.asset_path }}
            ${{ steps.artifact.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Update dev-latest prerelease
        if: ${{ inputs.publish_latest }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          latest_apk="$RUNNER_TEMP/paseo-debug.apk"
          latest_checksum="$RUNNER_TEMP/SHA256SUMS.txt"
          cp "${{ steps.artifact.outputs.asset_path }}" "$latest_apk"
          sha256sum "$latest_apk" | sed "s#  $latest_apk#  paseo-debug.apk#" > "$latest_checksum"

          if ! gh release view dev-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create dev-latest \
              --repo "${{ github.repository }}" \
              --target "${{ steps.source.outputs.sha }}" \
              --title "Paseo Debug (latest)" \
              --notes "Latest development APK. Source commit: ${{ steps.source.outputs.sha }}" \
              --prerelease
          else
            gh release edit dev-latest \
              --repo "${{ github.repository }}" \
              --title "Paseo Debug (latest)" \
              --notes "Latest development APK. Source commit: ${{ steps.source.outputs.sha }}"
          fi

          gh release upload dev-latest "$latest_apk" "$latest_checksum" \
            --clobber \
            --repo "${{ github.repository }}"
